# HSSM ecosystem shared MkDocs base (Material theme, design-system palette).
# VENDORED COPY — source of truth: https://github.com/lnccbrown/HSSMSpine
# (docs-brand/mkdocs-brand.yml). Edit there and re-sync; local edits will be
# flagged as drift.
#
# Distributed as overrides/.mkdocs-brand.yml: MkDocs publishes non-template
# files from a theme's custom_dir to the site root, but skips dotfiles.
#
# Each site's mkdocs.yml starts with:
#   INHERIT: docs/overrides/.mkdocs-brand.yml     (HSSMSpine: _docs/overrides/...)
# MkDocs deep-merges mappings and replaces lists, so a site keeps its own
# theme.custom_dir, theme.features, plugins and markdown_extensions, and must
# not redefine theme.name, theme.palette, theme.font, theme.logo, theme.favicon
# or extra_css.

theme:
  name: material
  # IBM Plex is self-hosted from styles/tokens.css; never load Google Fonts.
  font: false
  logo: images/navlogo.png
  favicon: images/navlogo.png
  palette:
    - media: "(prefers-color-scheme)"
      scheme: ocean
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: ocean
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra_css:
  - styles/tokens.css
  - styles/extra.css
