name: Setup Python environment
description: Set up Python environment for the repository
inputs:
  python-version:
    description: "The Python version to set up"
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # The `graphviz` Python package is a binding, not a bundle: it shells out
    # to the `dot` binary, which ubuntu-latest does not ship. Without this,
    # every notebook that renders a model graph dies on
    # `ExecutableNotFound: PosixPath('dot')`.
    - name: Install graphviz
      run: sudo apt-get update && sudo apt-get install -y graphviz
      shell: bash

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "latest"
        python-version: ${{ inputs.python-version }}
        enable-cache: true

    # (a stale `if: steps.cache.outputs.cache-hit` guard used to sit here —
    # no step with id `cache` exists, so it always evaluated true)
    - name: Install hssm
      run: uv sync --group notebook
      shell: bash
