name: Run slow tests

on:
  workflow_dispatch:  # Manual trigger
  workflow_call:  # Called by drift.yml (scheduled drift detection)
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/run_slow_tests.yml"
      - ".github/workflows/run_tests.yml"

jobs:
  run_slow_tests:
    name: Run full test suite including slow tests
    uses: ./.github/workflows/run_tests.yml
    with:
      run_slow_tests: true
