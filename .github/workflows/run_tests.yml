name: Run tests

on:
  pull_request:
  workflow_call:
    inputs:
      run_slow_tests:
        description: "Whether to run only the slow tests instead of the fast suite"
        required: false
        default: false
        type: boolean
      test_args:
        description: "Additional arguments or paths to pass to pytest"
        required: false
        default: ""
        type: string

jobs:
  run_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HSSM_TEST_ARGS: ${{ inputs.test_args }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/setup-env
        with:
          python-version: ${{ matrix.python-version }}

      # Reuse the ONNX networks that tests fetch from the Hugging Face Hub rather
      # than downloading them on every run (#1061). The key follows the model
      # configs, which name those files; when it changes, restore-keys starts
      # from the previous cache.
      - name: Cache Hugging Face Hub downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-huggingface-hub-${{ hashFiles('src/hssm/modelconfig/**') }}
          restore-keys: |
            ${{ runner.os }}-huggingface-hub-

      - name: Run fast tests
        if: ${{ !inputs.run_slow_tests }}
        run: uv run pytest -m "not slow" $HSSM_TEST_ARGS

      - name: Run slow tests
        if: ${{ inputs.run_slow_tests }}
        # --log-cli-level=INFO (the ini default is WARNING) so the RSS lines
        # below actually show up in the log.
        run: uv run pytest -m slow --log-cli-level=INFO $HSSM_TEST_ARGS
        env:
          # Log per-test RSS to diagnose slow-test memory leaks. This step only
          # runs on the slow-test path (run_slow_tests.yml), so it stays scoped.
          HSSM_TEST_RSS_LOG: "1"

  # The network-inspection plots need the optional `inspect` extra (lanfactory,
  # which pulls in torch), so they get their own job on one Python version
  # instead of adding torch to the matrix (#1505). The matrix still runs these
  # files, with the plot tests skipped.
  run_inspect_tests:
    if: ${{ !inputs.run_slow_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HSSM_TEST_ARGS: ${{ inputs.test_args }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/setup-env
        with:
          python-version: "3.13"

      # The plot tests use importorskip, so a broken install would skip them
      # and still pass. Fail here instead.
      - name: Install the inspect extra
        run: |
          uv sync --extra inspect
          uv run --extra inspect python -c "import lanfactory.network_inspectors"

      - name: Run network-inspection tests
        run: >-
          uv run --extra inspect pytest -m "not slow" $HSSM_TEST_ARGS
          tests/unit/plotting/test_network_inspection.py
          tests/test_network_inspection_optional.py
