name: Run tests

on:
  pull_request:
  workflow_call:
    inputs:
      run_slow_tests:
        description: "Whether to run only the slow tests instead of the fast suite"
        required: false
        default: false
        type: boolean
      test_args:
        description: "Additional arguments or paths to pass to pytest"
        required: false
        default: ""
        type: string

jobs:
  run_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HSSM_TEST_ARGS: ${{ inputs.test_args }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/setup-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run fast tests
        if: ${{ !inputs.run_slow_tests }}
        run: uv run pytest -m "not slow" $HSSM_TEST_ARGS

      - name: Run slow tests
        if: ${{ inputs.run_slow_tests }}
        run: uv run pytest -m slow $HSSM_TEST_ARGS
        env:
          # Log per-test RSS to diagnose slow-test memory leaks. This step only
          # runs on the slow-test path (run_slow_tests.yml), so it stays scoped.
          HSSM_TEST_RSS_LOG: "1"
