name: Run tests

on:
  pull_request:
  workflow_call:
    inputs:
      run_slow_tests:
        description: "Whether to run slow tests"
        required: false
        default: false
        type: boolean

jobs:
  run_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/setup-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run fast tests
        if: ${{ !inputs.run_slow_tests }}
        run: uv run pytest -m "not slow"

      - name: Run all tests
        if: ${{ inputs.run_slow_tests }}
        run: uv run pytest
        env:
          # Log per-test RSS to diagnose slow-test memory leaks. This step only
          # runs on the slow-test path (run_slow_tests.yml), so it stays scoped.
          HSSM_TEST_RSS_LOG: "1"
